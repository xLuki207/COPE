name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lockfile exists
        run: if (!(Test-Path Cargo.lock)) { exit 1 }

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Audit
        run: cargo install cargo-audit --locked; cargo audit

      - name: Verify binary
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cope.exe dist/cope-windows-x64.exe -Force
          $sha = (Get-FileHash -Algorithm SHA256 dist/cope-windows-x64.exe).Hash
          "$sha  cope-windows-x64.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256: $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: cope-windows-x64
          path: |
            dist/cope-windows-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cope-windows-x64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
